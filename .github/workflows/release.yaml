name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Needed for softprops/action-gh-release to create the release and upload assets.
permissions:
  contents: write

# Don't let two tag pushes produce overlapping releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: false
          files: dist/*.js
